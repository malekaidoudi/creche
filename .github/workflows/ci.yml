name: CI - Tests & Build

# Pipeline de vérification exécuté avant que les changements n'atteignent
# la production. Le déploiement frontend est assuré par Vercel (vercel.json),
# le backend par Render — aucune étape de déploiement n'est gérée ici.
# Cf. documentsV2/23_ANOMALIES_ET_RECOMMANDATIONS.md, anomalies #16 et #18.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Syntax check (all backend JS)
        run: |
          cd backend
          find . -name "*.js" -not -path "./node_modules/*" -exec node -c {} \;

      - name: Run backend tests
        run: |
          cd backend
          npm test
        env:
          JWT_SECRET: test-secret-ci-not-real
          NODE_ENV: test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Run frontend tests
        run: |
          cd frontend
          npm test -- --run
